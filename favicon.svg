  </defs>
  <rect width="32" height="32" fill="url(#dots)"/>
  <text x="16" y="23" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-size="18" font-weight="900" fill="#EEE8DC">JK</text>
</svg>
